<a href=/blog/>/blog</a></nav><p><time datetime=2026-10-23 pubdate>2026-10-23</time></p><section><p>人生在於體驗。強健的消化系統、好的「牙口」是豐富人生體驗的基礎。可能由於父母、外公的牙齒健康狀況都不太好，吃飯時他們「這個嚼不動、那個咬不爛」的場景給我印象頗深，我自己也將牙齒的缺損視為身體老化的標誌性事件（之一），因而對這類事相當焦慮。</p><p>隨着年齡增長，人體的各個零部件會不可避免地、不可逆地老化損傷。我們最終不得不接受從某個時刻起，與損壞的器官相處後半生。有些器官的損壞我暫時還難以接受——比如牙齒；然而有些損傷則已經習以為常了，比如<a href=https://blog.yitianshijie.net/2015/11/16/book-review-escape-velocity-2/ target=_blank rel="noopener noreferrer">眼睛（視力）</a>。但即便這些習以為常的損傷，細想起來，還是挺可惜的。</p></section></main></body></html>
