<a href=/blog/>/blog</a></nav><p><time datetime=2023-08-14 pubdate>2023-08-14</time></p><section><p>刚来深圳时我在深圳某图书馆办了一张读者卡并交了 300 元押金（应该是最高档位，可外借中外文图书；办理时我没有留意能借多少本）。最近才发现深圳图书馆卡其实不用交押金也有基本的借阅额度：中文文献 10 册/件+原版外文文献 1 册/件。我把押金退了。</p><p>Ref: <a href=https://www.szlib.org.cn/page/interlibrary-loan-service.html target=_blank rel="noopener noreferrer">深圳图书馆 - 服务指南</a>（有趣的是，只有中文版的「服务指南 - 外借服务」提到了免押金的「鹏城励读证」。）</p></section></main></body></html>
